<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹캠 뱀게임</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: #10151f; color: #e8ecf3;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px;
  }
  h1 { margin: 0 0 16px; font-size: 26px; letter-spacing: 1px; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .panel {
    background: #1a2230; border-radius: 14px; padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  #game { display: block; background: #0b0f17; border-radius: 8px; max-width: 100%; }
  .hud { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px; }
  .hud b { color: #7ee787; }
  .side { width: 300px; max-width: 100%; }
  #webcam-container { width: 100%; aspect-ratio: 1; background: #0b0f17; border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; color: #6b7a90; }
  #webcam-container canvas { width: 100%; height: 100%; transform: scaleX(-1); }
  .bars { margin-top: 12px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  .bar .name { width: 64px; text-transform: capitalize; }
  .bar .track { flex: 1; height: 14px; background: #0b0f17; border-radius: 7px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: #3b82f6; transition: width .1s; }
  .bar.active .fill { background: #7ee787; }
  .bar .pct { width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
  .current { margin-top: 10px; font-size: 20px; text-align: center; }
  .current span { color: #7ee787; font-weight: bold; }
  button {
    font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer;
    background: #3b82f6; color: white; font-weight: 600;
  }
  button:disabled { background: #3a4558; cursor: default; }
  button.secondary { background: #2d3748; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  label { font-size: 14px; display: block; margin-top: 12px; }
  input[type=range] { width: 100%; }
  .hint { font-size: 13px; color: #8b98ab; margin-top: 12px; line-height: 1.5; }
  #status { font-size: 13px; color: #fbbf24; margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
<h1>🐍 웹캠 뱀게임</h1>

<div class="wrap">
  <div class="panel">
    <div class="hud">
      <div>점수: <b id="score">0</b></div>
      <div>최고: <b id="best">0</b></div>
    </div>
    <canvas id="game" width="480" height="480"></canvas>
    <div class="buttons">
      <button id="startBtn">게임 시작</button>
      <button id="pauseBtn" class="secondary" disabled>일시정지</button>
    </div>
  </div>

  <div class="panel side">
    <div id="webcam-container">웹캠이 꺼져 있음</div>
    <div class="buttons">
      <button id="camBtn">웹캠 + 모델 켜기</button>
    </div>
    <div id="status"></div>
    <div class="bars" id="bars"></div>
    <div class="current">현재 입력: <span id="current">-</span></div>

    <label>인식 임계값: <span id="thVal">0.70</span>
      <input type="range" id="threshold" min="0.3" max="0.99" step="0.01" value="0.7">
    </label>
    <label>게임 속도: <span id="spVal">150</span>ms
      <input type="range" id="speed" min="60" max="400" step="10" value="150">
    </label>

    <div class="hint">
      · 클래스: left / right / up / down / neutral<br>
      · neutral이면 현재 방향 유지<br>
      · 키보드 방향키 / WASD도 사용 가능<br>
      · 스페이스바: 시작 / 일시정지
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
<script>
// ===== Teachable Machine (Pose 모델) =====
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/9UfoxY9Mn/";
let model, webcam, camCtx, maxPredictions = 0, camRunning = false;

const statusEl = document.getElementById("status");
const barsEl = document.getElementById("bars");
const currentEl = document.getElementById("current");
const thresholdEl = document.getElementById("threshold");

async function initCam() {
  const btn = document.getElementById("camBtn");
  btn.disabled = true;
  try {
    statusEl.textContent = "모델 불러오는 중...";
    model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    maxPredictions = model.getTotalClasses();

    statusEl.textContent = "웹캠 켜는 중...";
    webcam = new tmPose.Webcam(240, 240, true); // flip = true
    await webcam.setup();
    await webcam.play();

    // 웹캠 화면 + 포즈 골격을 그릴 캔버스
    const camCanvas = document.createElement("canvas");
    camCanvas.width = 240; camCanvas.height = 240;
    camCanvas.style.transform = "none"; // 이미 flip 처리됨
    camCtx = camCanvas.getContext("2d");
    const container = document.getElementById("webcam-container");
    container.innerHTML = "";
    container.appendChild(camCanvas);

    barsEl.innerHTML = "";
    for (const name of model.getClassLabels()) {
      barsEl.insertAdjacentHTML("beforeend",
        `<div class="bar" data-name="${name}"><div class="name">${name}</div>
         <div class="track"><div class="fill"></div></div><div class="pct">0%</div></div>`);
    }

    camRunning = true;
    statusEl.textContent = "";
    btn.textContent = "웹캠 작동 중";
    requestAnimationFrame(camLoop);
  } catch (e) {
    console.error(e);
    statusEl.textContent = "오류: " + (e.message || e) + " (로컬 서버로 열었는지, 카메라 권한을 확인하세요)";
    btn.disabled = false;
  }
}

async function camLoop() {
  if (!camRunning) return;
  webcam.update();
  await predict();
  requestAnimationFrame(camLoop);
}

async function predict() {
  const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
  const preds = await model.predict(posenetOutput);

  camCtx.drawImage(webcam.canvas, 0, 0);
  if (pose) {
    tmPose.drawKeypoints(pose.keypoints, 0.5, camCtx);
    tmPose.drawSkeleton(pose.keypoints, 0.5, camCtx);
  }

  const th = parseFloat(thresholdEl.value);
  let best = preds[0];
  for (const p of preds) if (p.probability > best.probability) best = p;

  const rows = barsEl.querySelectorAll(".bar");
  preds.forEach((p, i) => {
    const row = rows[i];
    row.querySelector(".fill").style.width = (p.probability * 100).toFixed(0) + "%";
    row.querySelector(".pct").textContent = (p.probability * 100).toFixed(0) + "%";
    row.classList.toggle("active", p === best && p.probability >= th);
  });

  if (best.probability >= th) {
    const cls = best.className.trim().toLowerCase();
    currentEl.textContent = cls;
    if (cls !== "neutral") setDirection(cls);
  } else {
    currentEl.textContent = "?";
  }
}

// ===== Snake Game =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELLS = 20;
const SIZE = canvas.width / CELLS;

const DIRS = {
  up:    { x: 0,  y: -1 },
  down:  { x: 0,  y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1,  y: 0 },
};

let snake, dir, nextDir, food, score, running = false, paused = false, gameOver = false, timer = null;
let best = 0;
try { best = parseInt(localStorage.getItem("snakeBest") || "0", 10); } catch (e) {}
document.getElementById("best").textContent = best;

function resetGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = DIRS.right;
  nextDir = dir;
  score = 0;
  gameOver = false;
  document.getElementById("score").textContent = score;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function setDirection(name) {
  const d = DIRS[name];
  if (!d || !running || paused) return;
  // 현재 진행 방향의 반대로는 꺾을 수 없음
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
  const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return endGame();

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = "#0b0f17";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자
  ctx.strokeStyle = "#141b27";
  for (let i = 0; i <= CELLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE); ctx.stroke();
  }

  // 먹이
  ctx.fillStyle = "#f87171";
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2.6, 0, Math.PI * 2);
  ctx.fill();

  // 뱀
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#7ee787" : "#3fb950";
    ctx.beginPath();
    ctx.roundRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2, 5);
    ctx.fill();
  });
}

function overlay(text, sub) {
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.font = "bold 36px 'Malgun Gothic', sans-serif";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 10);
  if (sub) {
    ctx.font = "18px 'Malgun Gothic', sans-serif";
    ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 26);
  }
}

function startGame() {
  resetGame();
  running = true; paused = false;
  document.getElementById("pauseBtn").disabled = false;
  document.getElementById("pauseBtn").textContent = "일시정지";
  document.getElementById("startBtn").textContent = "다시 시작";
  restartTimer();
  draw();
}

function restartTimer() {
  clearInterval(timer);
  if (running && !paused) timer = setInterval(step, parseInt(document.getElementById("speed").value, 10));
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "계속하기" : "일시정지";
  restartTimer();
  if (paused) overlay("일시정지"); else draw();
}

function endGame() {
  running = false;
  clearInterval(timer);
  document.getElementById("pauseBtn").disabled = true;
  if (score > best) {
    best = score;
    try { localStorage.setItem("snakeBest", best); } catch (e) {}
    document.getElementById("best").textContent = best;
  }
  draw();
  overlay("게임 오버", `점수 ${score} · 스페이스바로 다시 시작`);
}

// ===== 입력 =====
const KEYS = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
};
document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    if (!running) startGame(); else togglePause();
    return;
  }
  const name = KEYS[e.key] || KEYS[e.key.toLowerCase?.()];
  if (name) { e.preventDefault(); setDirection(name); }
});

document.getElementById("startBtn").onclick = startGame;
document.getElementById("pauseBtn").onclick = togglePause;
document.getElementById("camBtn").onclick = initCam;

thresholdEl.oninput = () =>
  document.getElementById("thVal").textContent = parseFloat(thresholdEl.value).toFixed(2);
document.getElementById("speed").oninput = e => {
  document.getElementById("spVal").textContent = e.target.value;
  restartTimer();
};

// 초기 화면
resetGame();
draw();
overlay("웹캠 뱀게임", "게임 시작 버튼 또는 스페이스바");
</script>
</body>
</html>
